- tier_name: "Mentors and Coaches"
  size: small
  description: |-
  members:
    - name: "Adam Rizika"
      role: "Head Non-Technical Coach"
      image: ../images/TeamMembers/Adam.jpg
      bio: "Adam guides us through general team management, outreach, and finances. He was a founding mentor for the team."

    - name: "Matthew Allen"
      role: "Head Technical Coach"
      image: ../images/TeamMembers/Matthew.jpg
      bio: "Matthew advises us and is a student at Boston University. As an alumni of FIRST, he shares his prior knowledge."

    - name: "Georgie Ford"
      role: "Technical CAD mentor "
      image: ../images/TeamMembers/Georgie.jpg
      bio: "Georgie advises our CADers and is a student at Boston University. As an alumni of FIRST, she gives us specialized recommendations."

    - name: "Luki Deitchman"
      role: "Technical CAD Mentor"
      # image: ../images/Mentors/LukiDeitchman.png
      bio: "Luki advises our CADers and is a student at Boston University. As an alumni of FIRST, they give us specialized recommendations."

    - name: "Aubrey Love"
      role: "CAD & Manufacturing Mentor"
      image: ../images/Mentors/AubreyLove.png
      bio: "Mr. Love helps us overcome problems related to Fusion 360 and CAD. Additionally, he allows us to use his machines to manufacture custom adaption pieces for our robot."
    
    - name: "Britt Stevens"
      role: "Mentor"
      image: ../images/Mentors/BrittStevens.png
      bio: "Britt Stevens advises us on how to work within the BHS system to get resources from both the school and the town of Brookline."

    - name: "Michelle McGlone"
      role: "Summer Camp Advisor"
      image: ../images/Mentors/MichelleMcGone.png
      bio: "Michelle from Brookline Adult and Community Education advises us on how to run a great camp."

    - name: "Ed Wiser"
      role: "Build Advisor"
      image: ../images/Mentors/EdWiser.png
      bio: "Mr. Weiser is a teacher at Brookline High School and advises us on building, especially in his robotics class."

